<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/Logo-final.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f0e6" />
    <!-- Resolves the issued process before first paint. Without this the light
         palette renders for a frame and then swaps, which on a full-bleed
         ground is a whole-screen flash rather than a subtle one. Kept inline
         and synchronous on purpose — a deferred module is already too late.
         Mirrors readStoredTheme() in src/lib/theme.js. -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('ms-theme')
          var t =
            s === 'light' || s === 'dark'
              ? s
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = t
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.content = t === 'dark' ? '#0a2440' : '#f3f0e6'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <title>MusicStream</title>
    <meta
      name="description"
      content="MusicStream is a fast, ad-free native Android music player with background playback, synced lyrics, an equalizer and offline downloads."
    />
    <meta property="og:title" content="MusicStream — Your music, everywhere" />
    <meta
      property="og:description"
      content="A fast, ad-free native Android music player. Background playback, synced lyrics, equalizer, offline downloads."
    />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Archivo carries a real width axis, which technical lettering needs: the
         same voice drawn wide for a drawing title and condensed for a
         title-block field. Azeret Mono is the instrument readout and exists
         only for figures. display=swap avoids invisible text while loading. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..112,400..800&family=Azeret+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
